name: Release Pipeline

on:
  push:
    tags:
      - 'sdks/go/v*'
      - 'sdks/node/v*'
      - 'sdks/react/v*'
      - 'sdks/react-native/v*'

jobs:
  release-go:
    name: Release Go Module
    if: startsWith(github.ref, 'refs/tags/sdks/go/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go Module builds
        run: |
          cd sdks/go
          go build -v ./...

      - name: Post-release verification
        run: echo "Go tag published successfully. Ready for public proxy resolution."

  release-npm:
    name: Release npm Packages
    if: |
      startsWith(github.ref, 'refs/tags/sdks/node/v') ||
      startsWith(github.ref, 'refs/tags/sdks/react/v') ||
      startsWith(github.ref, 'refs/tags/sdks/react-native/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build JS Workspace Packages
        run: npm run build

      - name: Dry-run Publish npm Packages
        run: |
          echo "Dry run publication of npm workspace packages"
          # npm publish --dry-run
