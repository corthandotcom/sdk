name: React SDK CI

on:
  push:
    branches: [ main ]
    paths:
      - 'sdks/react/**'
      - 'packages/**'
      - 'specs/**'
      - '.github/workflows/react-sdk-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sdks/react/**'
      - 'packages/**'
      - 'specs/**'
      - '.github/workflows/react-sdk-ci.yml'

jobs:
  build-and-test:
    name: Build & Test React SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=sdks/react

      - name: Lint
        run: npm run lint --workspace=sdks/react

      - name: Build
        run: npm run build --workspace=sdks/react

      - name: Test
        run: npm run test --workspace=sdks/react
