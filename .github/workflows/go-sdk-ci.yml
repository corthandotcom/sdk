name: Go SDK CI

on:
  push:
    branches: [ main ]
    paths:
      - 'sdks/go/**'
      - 'packages/**'
      - 'specs/**'
      - '.github/workflows/go-sdk-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sdks/go/**'
      - 'packages/**'
      - 'specs/**'
      - '.github/workflows/go-sdk-ci.yml'

jobs:
  test:
    name: Build & Test Go SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: 'sdks/go/go.sum'

      - name: Verify Dependencies
        run: |
          cd sdks/go
          go mod tidy

      - name: Build Go SDK
        run: |
          cd sdks/go
          go build -v ./...

      - name: Run Tests
        run: |
          cd sdks/go
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
